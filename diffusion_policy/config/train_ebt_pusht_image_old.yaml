defaults:
  - _self_
  - task: pusht_image

name: train_ebt_pusht_image_old
_target_: diffusion_policy.workspace.train_ebt_transformer_hybrid_workspace_old.TrainEBTTransformerHybridWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"

horizon: 16
n_obs_steps: 4
n_action_steps: 8
n_latency_steps: 0
past_action_visible: False

policy:
  _target_: diffusion_policy.policy.ebt_transformer_hybrid_image_policy_old.EBTTransformerHybridImagePolicy

  shape_meta: ${shape_meta}
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}
  
  # MCMC parameters
  num_inference_steps: 10
  mcmc_step_size: 0.01
  mcmc_step_size_learnable: true
  langevin_noise_std: 0.001
  langevin_noise_learnable: false
  
  # Initialization
  initial_action_std: 1.0
  initial_action_type: 'gaussian'
  
  # Gradient clipping
  clip_grad: true
  clip_grad_value: 1.0
  
  # Action clamping
  clamp_actions: true
  clamp_actions_value: 10.0
  
  # Transformer architecture (SIMPLIFIED)
  n_layer: 8
  n_head: 4
  n_emb: 256
  p_drop_emb: 0.0
  p_drop_attn: 0.3
  causal_attn: true
  energy_head_hidden_dim: null
  # REMOVED: obs_as_cond, n_cond_layers (no longer needed!)
  
  # Vision encoder
  crop_shape: [76, 76]
  obs_encoder_group_norm: false
  eval_fixed_crop: false

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 64
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: false

val_dataloader:
  batch_size: 64
  num_workers: 4
  shuffle: false
  pin_memory: true
  persistent_workers: false

optimizer:
  learning_rate: 1.0e-4
  transformer_weight_decay: 1.0e-3
  obs_encoder_weight_decay: 1.0e-6
  betas: [0.9, 0.95]
  mcmc_lr_scale: 0.1

training:
  device: "cuda:0"
  seed: 42
  debug: false
  resume: true
  num_epochs: 3000
  gradient_accumulate_every: 1
  use_ema: true
  lr_scheduler: cosine
  lr_warmup_steps: 500
  rollout_every: 50
  val_every: 1
  checkpoint_every: 50
  sample_every: 5
  tqdm_interval_sec: 1.0
  max_train_steps: null
  max_val_steps: null

logging:
  project: diffusion_policy_ebt
  resume: true
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 5
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: true
  save_last_snapshot: false

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}